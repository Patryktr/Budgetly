name: Budgetly CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Budgetly.sln --configuration Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Budgetly.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Budgetly.Web/package-lock.json
      - run: npm ci
      - run: npm run build
